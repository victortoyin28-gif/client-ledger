<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Ledger</title>
    <meta http-equiv="refresh" content="0; url=./app.html" />
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eff6ff, #f5f7fb);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .redirect {
        background: var(--card);
        padding: 2rem 2.5rem;
        border-radius: 16px;
        box-shadow: 0 20px 45px rgba(37, 99, 235, 0.12);
        text-align: center;
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="redirect">
      <p>Redirecting to the Client Ledger...</p>
      <p><a href="./app.html">Open app</a></p>
    </div>
  </body>
</html>
